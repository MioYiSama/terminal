name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must satisfy `minimum_zig_version` in crates/ghostty-sys/ghostty/build.zig.zon.
  ZIG_VERSION: 0.17.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --timings --target ${{ matrix.target }}

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.target }}
          path: target/cargo-timings/cargo-timing.html

      - name: Package
        id: package
        shell: bash
        run: |
          name="terminal-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            file="dist/$name.zip"
            7z a "$file" "./$dir/terminal.exe"
          else
            file="dist/$name.tar.gz"
            tar -C "$dir" -czf "$file" terminal
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Upload the archive as-is (named after the file) instead of zipping it
      # again.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: terminal-*
          merge-multiple: true
          # Keep the Windows .zip intact instead of extracting it.
          skip-decompress: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
