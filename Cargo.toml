[package]
name = "terminal"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/ghostty-sys", "crates/pty"]

[dependencies]
catppuccin = { version = "2.8.0", features = ["serde"] }
dirs = "7.0.0"
futures = "0.3"
ghostty-sys = { version = "0.1.0", path = "crates/ghostty-sys" }
gpui = "0.2.2"
pty = { version = "0.1.0", path = "crates/pty" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
