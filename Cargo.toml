[package]
name = "terminal"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/ghostty-sys", "crates/pty"]

[dependencies]
catppuccin = { version = "2.8.0", features = ["serde"] }
dirs = "7.0.0"
fluent-bundle = "0.16.0"
futures = "0.3"
ghostty-sys = { version = "0.1.0", path = "crates/ghostty-sys" }
gpui = "0.2.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pty = { version = "0.1.0", path = "crates/pty" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
unicode-segmentation = "1.13.3"

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSImage",
  "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
fluent-syntax = "0.12.0"
