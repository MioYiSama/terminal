[package]
name = "terminal"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/ghostty-sys", "crates/pty"]

[dependencies]
futures = "0.3"
ghostty-sys = { version = "0.1.0", path = "crates/ghostty-sys" }
gpui = "0.2.2"
pty = { version = "0.1.0", path = "crates/pty" }

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
