[package]
name = "pty"
version = "0.1.0"
edition = "2024"
description = "Minimal pseudo terminal: Unix openpty(3) and Windows ConPTY"
license = "MIT"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
